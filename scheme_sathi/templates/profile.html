<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SchemeSathi - Your Details</title>
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>

    <div class="tricolor-strip">
        <div class="saffron"></div>
        <div class="white"></div>
        <div class="green"></div>
    </div>

    <div class="site-header">
        <h1>SchemeSathi</h1>
        <p>Enter your details to check eligible schemes</p>
    </div>

    <div class="page-wrap">
        <div class="form-card">

            <div class="lang-row">
                <label for="languageSelect">Language / भाषा:</label><br>
                <select id="languageSelect" class="form-select">
                    <option value="en">English</option>
                    <option value="hi">हिंदी</option>
                </select>
            </div>

            <h2 data-en="Enter Your Details" data-hi="अपनी जानकारी दर्ज करें">Enter Your Details</h2>

            <form method="POST" class="row g-3 mt-2">
                <div class="col-md-6">
                    <label data-en="Age" data-hi="उम्र">Age</label>
                    <input name="age" type="number" class="form-control" required>
                </div>

                <div class="col-md-6">
                    <label data-en="Gender" data-hi="लिंग">Gender</label>
                    <select name="gender" class="form-select" required>
                        <option value="Male" data-en="Male" data-hi="पुरुष">Male</option>
                        <option value="Female" data-en="Female" data-hi="महिला">Female</option>
                        <option value="Other" data-en="Other" data-hi="अन्य">Other</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label data-en="Income (annual)" data-hi="वार्षिक आय">Income (annual)</label>
                    <input name="income" type="number" class="form-control" required>
                </div>

                <div class="col-md-6">
                    <label data-en="State" data-hi="राज्य">State</label>
                    <input name="state" class="form-control" required>
                </div>

                <div class="col-md-6">
                    <label data-en="Category" data-hi="श्रेणी">Category</label>
                    <select name="category" class="form-select" required>
                        <option value="General" data-en="General" data-hi="सामान्य">General</option>
                        <option value="OBC" data-en="OBC" data-hi="अन्य पिछड़ा वर्ग">OBC</option>
                        <option value="SC" data-en="SC" data-hi="अनुसूचित जाति">SC</option>
                        <option value="ST" data-en="ST" data-hi="अनुसूचित जनजाति">ST</option>
                        <option value="EWS" data-en="EWS" data-hi="आर्थिक रूप से कमजोर वर्ग">EWS</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label data-en="Occupation" data-hi="व्यवसाय">Occupation</label>
                    <select name="occupation" class="form-select" required>
                        <option value="Farmer" data-en="Farmer" data-hi="किसान">Farmer</option>
                        <option value="Student" data-en="Student" data-hi="छात्र">Student</option>
                        <option value="Unemployed" data-en="Unemployed" data-hi="बेरोज़गार">Unemployed</option>
                        <option value="Self-employed" data-en="Self-employed" data-hi="स्व-रोज़गार">Self-employed</option>
                        <option value="Senior Citizen" data-en="Senior Citizen" data-hi="वरिष्ठ नागरिक">Senior Citizen</option>
                        <option value="Homemaker" data-en="Homemaker" data-hi="गृहिणी">Homemaker</option>
                    </select>
                </div>

                <div class="col-12 submit-row">
                    <button type="submit" class="btn-primary-custom" data-en="Submit" data-hi="जमा करें">Submit</button>
                </div>
            </form>

        </div>
    </div>

    <footer class="site-footer">
        Your details are only used to match you with eligible schemes.
    </footer>

<script>
    // switches visible labels/options between English and Hindi
    // note: option "value" attributes stay fixed in English so the
    // backend always receives consistent data regardless of language
    const languageSelect = document.getElementById('languageSelect');

    languageSelect.addEventListener('change', function () {
        const lang = this.value;
        document.querySelectorAll('[data-en]').forEach(el => {
            el.innerText = el.getAttribute('data-' + lang);
        });
    });
</script>

</body>
</html>
