<!DOCTYPE html>
<html>
<head>
    <title>SchemeSathi - Results</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; font-family: Arial, sans-serif; }
        .container { max-width: 800px; margin: 50px auto; }
        .scheme-card { background: white; padding: 20px; margin-bottom: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .scheme-title { font-size: 1.2rem; font-weight: bold; color: #0d6efd; }
        .scheme-benefit { margin: 10px 0; }
        .apply-btn { background-color: #0d6efd; color: white; border: none; padding: 8px 15px; border-radius: 5px; text-decoration: none; }
        .apply-btn:hover { background-color: #0b5ed7; }
        .no-schemes { text-align: center; font-size: 1.1rem; color: #dc3545; margin-top: 30px; }
        .back-btn { display: block; width: 120px; margin: 30px auto 0; text-align: center; padding: 8px 15px; background: #6c757d; color: white; border-radius: 5px; text-decoration: none; }
        .back-btn:hover { background: #5c636a; }
    </style>
</head>
<body>
<div class="container">
    <h2 class="text-center mb-4" data-en="Your Eligible Schemes" data-hi="आपके पात्र योजनाएँ">Your Eligible Schemes</h2>

    {% if schemes %}
        {% for scheme in schemes %}
        <div class="scheme-card">
            <div class="scheme-title">{{ scheme.name }}</div>
            <div class="scheme-benefit">{{ scheme.benefit }}</div>
            <a href="{{ scheme.link }}" target="_blank" class="apply-btn" data-en="Apply Now" data-hi="अभी आवेदन करें">Apply Now</a>
        </div>
        {% endfor %}
    {% else %}
        <div class="no-schemes" data-en="No schemes found for your profile." data-hi="आपकी प्रोफ़ाइल के लिए कोई योजना नहीं मिली।">
            No schemes found for your profile.
        </div>
    {% endif %}

    <a href="/profile" class="back-btn" data-en="Back" data-hi="वापस">Back</a>
</div>

<!-- Language switch script -->
<script>
    const languageSelect = document.getElementById('languageSelect');

    // If you want to add language select on results page:
    // You can pass the selected language via Flask or localStorage
    // For now we will add a quick switch
    const langSelect = document.createElement('select');
    langSelect.classList.add('form-select', 'w-25', 'mx-auto', 'mb-3');
    langSelect.innerHTML = '<option value="en">English</option><option value="hi">हिंदी</option>';
    document.querySelector('.container').insertBefore(langSelect, document.querySelector('.container').firstChild);

    langSelect.addEventListener('change', function() {
        const lang = this.value;
        document.querySelectorAll('[data-en]').forEach(el => {
            if(el.tagName === 'OPTION') el.innerText = el.getAttribute('data-' + lang);
            else el.innerText = el.getAttribute('data-' + lang);
        });
    });
</script>

</body>
</html>
